<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NZ Coffee Availability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <!-- <p class="eyebrow">NZ Coffee Release Tracker</p> -->
      <h1>NZ Coffee Release Tracker</h1>
      <!-- <p class="subtitle">Live snapshot from Rocket Coffee and Atomic Coffee. Updated daily.</p> -->
      <div class="stats" id="stats"></div>
      <p class="meta" id="last-updated">Loading latest data...</p>
    </section>

    <section class="controls">
      <label class="search-wrap" for="searchInput">
        <span>Search coffees</span>
        <input id="searchInput" type="search" placeholder="Try: decaf, colombia, espresso blend">
      </label>

      <div class="select-filters">
        <label for="sourceFilter">
          <span>Store</span>
          <select id="sourceFilter">
            <option value="all">All stores</option>
          </select>
        </label>
        <label for="decafFilter">
          <span>Decaf</span>
          <select id="decafFilter">
            <option value="all">All coffees</option>
            <option value="true">Decaf</option>
            <option value="false">Caffeinated</option>
          </select>
        </label>
        <label for="blendFilter">
          <span>Blend</span>
          <select id="blendFilter">
            <option value="all">All coffees</option>
            <option value="true">Blends only</option>
            <option value="false">No blends</option>
          </select>
        </label>
        <label for="sortFilter">
          <span>Sort</span>
          <select id="sortFilter">
            <option value="title">A-Z</option>
            <option value="title-desc">Z-A</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="price-high">Price: high to low</option>
            <option value="price-low">Price: low to high</option>
          </select>
        </label>
      </div>

      <div class="filters" id="categoryFilters">
        <span class="filter-label">Roast type</span>
      </div>
    </section>

    <section>
      <div class="list-head">
        <h2>Available Coffees</h2>
        <p id="resultCount">0 results</p>
      </div>
      <div class="cards" id="cards"></div>
      <p class="error" id="errorMessage" hidden></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
